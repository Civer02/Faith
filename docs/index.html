<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src https://bible-api.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4efe4">
  <meta name="apple-mobile-web-app-title" content="Secrete Souce">
  <title>Secrete Souce</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1>Secrete Souce</h1>
      <button type="button" id="theme" class="theme">Dark mode</button>
    </div>
    <p class="date" id="today"></p>
    <ul class="key" id="color-key" aria-label="Highlight key">
      <li><span class="dot understand"></span> Understand</li>
      <li><span class="dot lookup"></span> Look up</li>
      <li><span class="dot deep"></span> Deep dive</li>
    </ul>
  </header>

  <main>
    <p class="status" id="status" hidden></p>
    <article id="reading" aria-live="polite"></article>
  </main>

  <div class="toolbar" role="toolbar" aria-label="Highlight colors">
    <button type="button" class="tool" data-color="understand" aria-pressed="true">
      <span class="dot understand"></span> Understand
    </button>
    <button type="button" class="tool" data-color="lookup" aria-pressed="false">
      <span class="dot lookup"></span> Look up
    </button>
    <button type="button" class="tool" data-color="deep" aria-pressed="false">
      <span class="dot deep"></span> Deep dive
    </button>
    <button type="button" class="print" id="print">Print</button>
  </div>

  <script src="guard.js"></script>
  <script src="app.js"></script>
</body>
</html>
