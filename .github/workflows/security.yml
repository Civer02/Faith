name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 15 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Scan Python for risky calls
        run: python -m bandit -ll -ii -r daily_script.py docs/serve.py scripts

      - name: Run repository security checks
        run: python scripts/security_check.py

      - name: Run guard tests
        run: |
          python -m unittest discover -s tests -v
          node tests/guard.test.js
